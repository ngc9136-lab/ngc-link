<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NGC — banner 1 de escritorio (1920x800)</title>
<!--
  Banner 1 de la portada, el que faltaba. 1920x800, mismo sistema visual que
  ngc-banner-2/3/4. Las fuentes van embebidas en base64 por build-banner.mjs,
  asi que el archivo final no depende de Google Fonts ni de ninguna red.
-->
<style>
  /* __FUENTES__ */
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy-alto:#0B1327;
    --navy-medio:#133C5C;
    --navy-bajo:#071021;
    --oro:#D8B868;
    --gris-claro:#C6D0DC;
  }
  html,body{width:1920px;height:800px;overflow:hidden;background:var(--navy-bajo)}
  body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}

  .banner{
    position:relative;width:1920px;height:800px;
    background:linear-gradient(135deg,var(--navy-alto) 0%,var(--navy-medio) 50%,var(--navy-bajo) 100%);
    overflow:hidden;
  }

  /* atmosfera: nada de fotos falsas, solo luz y trazas de vuelo */
  .halo{
    position:absolute;left:50%;top:52%;width:1500px;height:900px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(216,184,104,.13) 0%,rgba(216,184,104,.05) 38%,transparent 68%);
    pointer-events:none;
  }
  .trazas{position:absolute;inset:0;opacity:.5;pointer-events:none}

  /* regla dorada de 4 px arriba + reglas laterales finas */
  .regla-arriba{position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,#8A6F32 0%,var(--oro) 22%,#F2DFAE 50%,var(--oro) 78%,#8A6F32 100%)}
  .regla-izq,.regla-der{position:absolute;top:0;bottom:0;width:1px;
    background:linear-gradient(180deg,rgba(216,184,104,.75),rgba(216,184,104,.14) 55%,rgba(216,184,104,.55))}
  .regla-izq{left:56px}
  .regla-der{right:56px}
  .regla-abajo{position:absolute;bottom:0;left:56px;right:56px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(216,184,104,.5) 30%,rgba(216,184,104,.5) 70%,transparent)}

  /* lockup arriba a la izquierda */
  .lockup{position:absolute;left:100px;top:64px;display:flex;flex-direction:column;gap:4px}
  .lockup .ngc{font-size:40px;font-weight:800;color:#fff;letter-spacing:.10em;line-height:1}
  .lockup .rotulo{font-size:15px;font-weight:600;color:var(--oro);letter-spacing:.34em;line-height:1}

  /* bloque central */
  .centro{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);
    width:1300px;text-align:center}
  .eyebrow{font-size:17px;font-weight:600;color:var(--oro);letter-spacing:.42em;
    text-transform:uppercase;margin-bottom:26px}
  .eyebrow span{display:inline-block;padding:0 2px}
  h1{font-size:82px;font-weight:700;color:#fff;line-height:1.06;letter-spacing:-.012em}
  h1 em{font-style:normal;color:var(--oro)}
  .bajada{margin-top:26px;font-size:23px;font-weight:400;color:var(--gris-claro);
    line-height:1.5;max-width:820px;margin-left:auto;margin-right:auto;text-wrap:balance}

  /* pildora dorada de CTA */
  .cta{display:inline-flex;align-items:center;gap:14px;margin-top:44px;
    padding:19px 46px;border-radius:999px;
    background:linear-gradient(180deg,#EBD49A 0%,var(--oro) 55%,#BE9A4C 100%);
    color:#0B1327;font-size:20px;font-weight:700;letter-spacing:.055em;text-transform:uppercase;
    box-shadow:0 14px 40px rgba(216,184,104,.26), inset 0 1px 0 rgba(255,255,255,.55)}
  .cta .flecha{font-size:22px;line-height:1;transform:translateY(-1px)}

  /* filete inferior con los rubros */
  .rubros{position:absolute;left:0;right:0;bottom:38px;text-align:center;
    font-size:14px;font-weight:500;color:rgba(198,208,220,.68);letter-spacing:.30em;text-transform:uppercase}
</style>
</head>
<body>
<div class="banner">
  <div class="halo"></div>

  <svg class="trazas" viewBox="0 0 1920 800" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="traza" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#D8B868" stop-opacity="0"/>
        <stop offset="45%"  stop-color="#D8B868" stop-opacity=".38"/>
        <stop offset="100%" stop-color="#D8B868" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="traza2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#8FB6D8" stop-opacity="0"/>
        <stop offset="50%"  stop-color="#8FB6D8" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#8FB6D8" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M-40,690 C 420,560 900,600 1960,392" fill="none" stroke="url(#traza)" stroke-width="1.6"/>
    <path d="M-40,742 C 480,626 980,660 1960,470" fill="none" stroke="url(#traza2)" stroke-width="1.2"/>
    <path d="M-40,140 C 560,236 1180,168 1960,268" fill="none" stroke="url(#traza2)" stroke-width="1.2"/>
  </svg>

  <div class="regla-arriba"></div>
  <div class="regla-izq"></div>
  <div class="regla-der"></div>
  <div class="regla-abajo"></div>

  <div class="lockup">
    <div class="ngc">NGC</div>
    <div class="rotulo">TIENDA AERONÁUTICA</div>
  </div>

  <div class="centro">
    <div class="eyebrow"><span>Militaria &middot; Táctico &middot; Aeronáutico</span></div>
    <h1>La aviación argentina,<br><em>bordada</em>.</h1>
    <p class="bajada">Parches, jerarquías, escudos y equipo de colección para quienes viven el cielo.</p>
    <div class="cta">Ver la tienda <span class="flecha">&rarr;</span></div>
  </div>

  <div class="rubros">Parches bordados &middot; Jerarquías &middot; Escudos &middot; Gorras &middot; Llaveros</div>
</div>
</body>
</html>
