  if (ds.devolver) { const g = S.data.Gastos.find(x => x.id === ds.devolver); if (g) { guardarFila('Gastos', { ...g, devuelto: 'si', fechaDevolucion: hoy() }); toast('Marcado como devuelto ✓', 'ok', 2200); } return; }
  if (ds.balde) {
    const b = BALDES.find(x => x.key === ds.balde); const row = S.data.Objetivos.find(o => o.balde === ds.balde);
    abrirForm('Objetivos', row || null, { titulo: b.nombre, fijos: { balde: b.key }, vals: row ? {} : { nombre: b.nombre } });
    return;
  }
  switch (ds.action) {
    case 'cerrar-sheet': return cerrarForm();
    case 'borrar-fila':
      if (confirm('¿Seguro que querés borrar este registro? No se puede deshacer.')) { borrarFila(formActual.hoja, formActual.row.id); cerrarForm(); toast('Borrado', 'ok', 2000); }
      return;
    case 'devolver-todos': {
      const d = deudaNegocio();
      if (!confirm(`¿Marcar ${d.items.length} gastos (${fmtV(d.total)}) como devueltos?`)) return;
      d.items.forEach(g => guardarFila('Gastos', { ...g, devuelto: 'si', fechaDevolucion: hoy() }, { render: false }));
      renderTodo(); toast('Todo marcado como devuelto ✓', 'ok'); return;
    }
    case 'probar': {
      const url = $('#a-url').value.trim(); if (!url) return toast('Primero escribí la URL del script.', 'warn');
      const prev = { u: S.cfg.scriptUrl, t: S.cfg.token }; S.cfg.scriptUrl = url; S.cfg.token = $('#a-token').value;
      llamarScript({ action: 'ping' }).then(() => toast('Conexión correcta con el script ✓', 'ok')).catch(er => toast(er.message, 'bad')).finally(() => { S.cfg.scriptUrl = prev.u; S.cfg.token = prev.t; });
      return;
    }
    case 'sync-ya': return sincronizar();
    case 'umbrales-default': Object.entries(DEFAULT_CFG.umbrales).forEach(([k, v]) => { const el = $('#u-' + k); if (el) el.value = fmtInput(v); }); return toast('Valores recomendados cargados. Tocá Guardar para aplicarlos.', 'info');
    case 'exportar': {
      const blob = new Blob([JSON.stringify({ exportado: new Date().toISOString(), data: S.data }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `finanzas-${hoy()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return;
    }
    case 'borrar-local':
      if (S.queue.length && !confirm(`Hay ${S.queue.length} cambios sin sincronizar que se van a perder. ¿Continuar?`)) return;
      if (!confirm('Se borran los datos y ajustes guardados en este dispositivo (la hoja de Google no se toca). ¿Continuar?')) return;
      Object.keys(localStorage).filter(k => k.startsWith('fin.')).forEach(k => localStorage.removeItem(k));
      location.reload(); return;
  }
});

/* =====================================================================
   25. INICIO
   ===================================================================== */
/* ---------- Importación de historial desde un enlace ----------
   Formato: index.html#importar=<JSON comprimido con gzip, en base64url>.
   El contenido va después del "#", así que nunca se envía al servidor que aloja la app.
   JSON: { Ingresos: {cols:[...], rows:[[...]]}, Gastos: {cols:[...], rows:[[...]]} } */
async function importarDesdeEnlace() {
  const m = location.hash.match(/^#importar=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search); // saca los datos de la barra de direcciones
  try {
    if (!('DecompressionStream' in window)) throw new Error('Este navegador no puede leer el enlace. Abrilo con Chrome actualizado.');
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const bytes = Uint8Array.from(atob(b64 + '==='.slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
    const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const datos = JSON.parse(txt);
    const hojas = Object.keys(datos).filter(h => HOJAS.includes(h) && Array.isArray(datos[h].rows));
    // Ajustes que puede traer el enlace (solo estos campos)
    const cfgOk = ['presupuesto', 'topeTarjetas', 'mesesObjetivo', 'diaCobro', 'cobroHabil'];
    const cfgNuevo = datos.cfg && typeof datos.cfg === 'object' ? Object.fromEntries(Object.entries(datos.cfg).filter(([k, v]) => cfgOk.includes(k) && isFinite(+v) && +v >= 0).map(([k, v]) => [k, +v])) : {};
    if (!hojas.length && !Object.keys(cfgNuevo).length) throw new Error('El enlace no tiene datos para importar.');
    const resumen = [...hojas.map(h => `${datos[h].rows.length} ${h.toLowerCase()}`), ...(Object.keys(cfgNuevo).length ? ['tus topes de gasto'] : [])].join(' y ');
    if (!confirm(`Se van a cargar ${resumen}. Si ya estaban cargados, se actualizan sin duplicarse. ¿Continuar?`)) return;
    const ahora = new Date().toISOString();
    for (const h of hojas) {
      const { cols, rows, soloCampos } = datos[h];
      for (const r of rows) {
        let row = normalizarFila(Object.fromEntries(cols.map((c, i) => [c, r[i] ?? ''])));
        if (!row.id) continue;
        // soloCampos: si la fila ya existe, solo se cambian esos campos (no pisa saldos que editaste)
        // Objetivos: hay una fila por balde; si ya existe con otro id, se actualiza esa
        const previa = Array.isArray(soloCampos) && S.data[h].find(x => x.id === row.id || (h === 'Objetivos' && row.balde && x.balde === row.balde));
        if (previa) row = { ...previa, ...Object.fromEntries(soloCampos.map(c => [c, row[c]])) };
        row.actualizado = ahora;
        registrarCambio(h, S.data[h].find(x => x.id === row.id), row);
        upsertLocal(h, row);
        encolar({ op: 'upsert', hoja: h, row });
      }
    }
    if (Object.keys(cfgNuevo).length) { Object.assign(S.cfg, cfgNuevo); guardarCfg(); }
    guardarDatos();
    toast(`Listo: ${resumen}. ${S.cfg.scriptUrl ? 'Se está guardando en tu planilla; puede tardar unos minutos.' : 'Configurá la URL del script para guardarlo en tu planilla.'}`, 'ok', 9000);
  } catch (e) {
    toast('No se pudo importar el historial: ' + e.message, 'bad');
  }
}

document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); deshacer(); } else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); rehacer(); }
});
async function iniciar() {
  $('#btn-undo').addEventListener('click', deshacer);
  $('#btn-redo').addEventListener('click', rehacer);
  renderUndo();
  irA('mes');
  setSync(S.cfg.scriptUrl ? (navigator.onLine ? 'idle' : 'offline') : 'local');
  await importarDesdeEnlace();
  renderTodo();
  sincronizar({ silencioso: true });
  actualizarCotizaciones();
  setInterval(() => actualizarCotizaciones(), 5 * 60 * 1000); // cotizaciones cada 5 minutos
  setInterval(() => { if (S.queue.length && navigator.onLine) sincronizar({ silencioso: true }); }, 60 * 1000); // reintento de la cola
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // Actualización automática: el navegador busca una versión nueva al abrir y al volver a la app;
    // cuando el service worker nuevo toma el control, la página se recarga sola (una vez).
    const habiaControl = !!navigator.serviceWorker.controller;
    let recargando = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaControl && !recargando) { recargando = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      const buscar = () => reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') buscar(); });
      setInterval(buscar, 30 * 60 * 1000);
    }).catch(err => console.warn('Service worker no registrado:', err));
  }
}
iniciar();
