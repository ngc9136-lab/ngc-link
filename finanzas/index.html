      { n: 'plan', l: 'Plan', t: 'select', o: opts({ '': 'Mantener', vender: 'Vender (ya si da ganancia)', esperar: 'Esperar (no vender por ahora)' }), half: true },
      { n: 'notaPlan', l: 'Nota del plan', t: 'text', max: 80, half: true, ph: 'Ej.: pasar a USDC', show: v => !!v.plan },
    ],
    // Pasa de la fila de la hoja a los campos del formulario
    cargar(row) {
      const r = { ...row, modo: 'unidad' };
      if (row.tipo === 'efectivo') r.tipo = 'liquidez'; // tenencias viejas de efectivo
      if (!esMercado(r)) { r.nombre = row.activo; r.saldo = row.cantidad; r.invertido = row.tipo !== 'liquidez' ? row.precioCompra : ''; }
      return r;
    },
    validar(v) {
      const err = {};
      if (esMercado(v)) {
        const q = +(formActual?.row?.cantidad || v.cantidad) || 0;
        if (+v.compraCant > 0 && !(+v.compraPrecio > 0)) err.compraPrecio = 'Poné el precio al que compraste.';
        if (+v.ventaCant > (+v.cantidad || q) + (+v.compraCant || 0)) err.ventaCant = 'No podés vender más de lo que tenés.';
        if (v.modo === 'total' && !(+v.montoTotal > 0)) err.montoTotal = 'Tiene que ser mayor a cero.';
      }
      return err;
    },
    // Pasa del formulario a las columnas de la hoja
    alGuardar(r) {
      if (!esMercado(r)) {
        r.activo = r.nombre; r.cantidad = r.saldo;
        r.precioCompra = r.tipo !== 'liquidez' ? (+r.invertido || r.saldo) : r.saldo;
        r.tcCompra = ''; r.fechaCompra = '';
      } else {
        if (r.modo === 'total') r.precioCompra = +r.montoTotal / +r.cantidad;
        let q = +r.cantidad, p = +r.precioCompra;
        if (+r.compraCant > 0) { const nq = q + +r.compraCant; p = (q * p + +r.compraCant * +r.compraPrecio) / nq; q = nq; }
        if (+r.ventaCant > 0) q = q - +r.ventaCant;
        r.cantidad = Math.round(q * 1e8) / 1e8; r.precioCompra = Math.round(p * 1e6) / 1e6;
        if (r.cantidad <= 0) r._borrar = true;
      }
      for (const k of ['nombre', 'saldo', 'invertido', 'modo', 'montoTotal', 'compraCant', 'compraPrecio', 'ventaCant']) delete r[k];
    },
    alCambiar(v, campo, set) {
      if (campo === 'tipo' && v.tipo === 'liquidez' && v.plataforma === 'Cocos') set('plataforma', 'Galicia');
      if (campo === 'tipo' && ['accion', 'cedear', 'etf', 'cripto'].includes(v.tipo)) set('monedaCompra', v.tipo === 'cedear' ? 'ARS' : 'USD');
    },
  },
  Vencimientos: {
    titulo: 'vencimiento',
    campos: [
      { n: 'concepto', l: 'Concepto', t: 'text', req: true, max: 80, ph: 'Ej.: Luz' },
      { n: 'monto', l: 'Monto', t: 'money', req: true, min: 0, half: true },
      { n: 'moneda', l: 'Moneda', t: 'select', o: opts({ ARS: 'Pesos', USD: 'Dólares' }), half: true },
      { n: 'fecha', l: 'Fecha de vencimiento', t: 'date', req: true, def: () => hoy() },
      { n: 'medio', l: 'Medio de pago', t: 'select', o: opts({ debito: 'Débito', efectivo: 'Efectivo', transferencia: 'Transferencia', visa: 'Visa', mastercard: 'Mastercard', otro: 'Otro' }), half: true },
      { n: 'estado', l: 'Estado', t: 'select', o: opts({ pendiente: 'Pendiente', pagado: 'Pagado' }), half: true },
    ],
    alGuardar(row) { row.origen = row.origen || 'manual'; },
  },
  Objetivos: {
    titulo: 'objetivo',
    campos: [
      { n: 'nombre', l: 'Nombre', t: 'text', max: 60 },
      { n: 'meta', l: 'Meta', t: 'money', min: 0, half: true },
      { n: 'moneda', l: 'Moneda', t: 'select', o: opts({ ARS: 'Pesos', USD: 'Dólares' }), half: true },
      { n: 'saldoInicial', l: 'Saldo inicial (ya ahorrado)', t: 'money', min: 0, help: 'Se le suman los ingresos variables asignados a este balde.' },
      { n: 'fechaMeta', l: 'Fecha objetivo (opcional)', t: 'date' },
    ],
  },
};

let formActual = null;
function abrirForm(hoja, row = null, extra = {}) {
  const def = FORMS[hoja];
  const base = row ? (def.cargar ? def.cargar(row) : { ...row }) : {};
  const vals = {};
  for (const c of def.campos) vals[c.n] = base[c.n] !== undefined && base[c.n] !== '' ? base[c.n] : c.def ? c.def() : c.t === 'select' ? c.o[0][0] : '';
  Object.assign(vals, extra.vals || {});
  formActual = { hoja, row, def, extra };
  $('#sheet-title').textContent = (row && row.id ? 'Editar ' : 'Nuevo ') + (extra.titulo || def.titulo);
  let html = '<form id="form-fila" novalidate><div class="formerr"></div><div class="grid2">';
  for (const c of def.campos) html += campoHTML(c, vals[c.n]);
  html += `</div><div class="btns" style="margin-top:6px"><button type="submit" class="btn pri">Guardar</button>${row && row.id ? '<button type="button" class="btn danger" data-action="borrar-fila">Borrar</button>' : ''}</div></form>`;
  $('#sheet-body').innerHTML = html;
  actualizarVisibles();
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  setTimeout(() => { const f = $('#form-fila input:not([type=date]), #form-fila select'); if (f && !row) f.focus({ preventScroll: true }); }, 50);
}
function cerrarForm() { $('#sheet').hidden = true; document.body.style.overflow = ''; formActual = null; }
function campoHTML(c, v) {
  const id = 'f-' + c.n; let input;
  const st = c.half ? '' : 'style="grid-column:1/-1"';
  if (c.t === 'select') input = `<select id="${id}" name="${c.n}">${c.o.map(([k, t]) => `<option value="${esc(k)}" ${String(v) === String(k) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>`;
  else if (c.t === 'date') input = `<input id="${id}" name="${c.n}" type="date" value="${esc(v)}" min="2000-01-01" max="2100-12-31">`;
  else if (c.t === 'money' || c.t === 'qty') input = `<input id="${id}" name="${c.n}" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${esc(fmtInput(v))}">`;
  else if (c.t === 'int') input = `<input id="${id}" name="${c.n}" type="number" inputmode="numeric" step="1" min="${c.min ?? ''}" max="${c.max ?? ''}" value="${esc(v)}">`;
  else input = `<input id="${id}" name="${c.n}" type="text" autocomplete="off" maxlength="${c.max || 200}" placeholder="${esc(c.ph || '')}" value="${esc(v)}" ${c.mayus ? 'autocapitalize="characters"' : ''}>`;
  return `<div class="field" data-campo="${c.n}" ${st}><label for="${id}">${c.l}${c.req ? ' *' : ''}</label>${input}${c.help ? `<small>${c.help}</small>` : ''}<div class="err" aria-live="polite"></div></div>`;
}
/** Lee los valores del formulario (texto crudo). */
function valoresForm() { const o = {}; for (const c of formActual.def.campos) { const el = $('#f-' + c.n); o[c.n] = el ? el.value : ''; } return o; }
function actualizarVisibles() {
  const v = valoresForm();
  for (const c of formActual.def.campos) if (c.show) $(`.field[data-campo="${c.n}"]`).hidden = !c.show(v);
}
/** Valida y convierte los valores. Devuelve {ok, row, errores}. */
function validarForm() {
  const raw = valoresForm(); const out = {}; const err = {};
  for (const c of formActual.def.campos) {
    if (c.show && !c.show(raw)) { out[c.n] = ''; continue; }
    let v = raw[c.n];
    if (typeof v === 'string') v = v.trim();
    if (c.req && (v === '' || v === null)) { err[c.n] = 'Este campo es obligatorio.'; continue; }
    if (v === '') { out[c.n] = ''; continue; }
    if (c.t === 'money' || c.t === 'qty') {
      const n = parseNum(v, c.t);
      if (n === null || isNaN(n)) { err[c.n] = 'Ingresá un número válido (ej.: 1.234,56).'; continue; }
      if (c.min !== undefined && n < c.min) { err[c.n] = c.min > 0 ? 'Tiene que ser mayor a cero.' : 'No puede ser negativo.'; continue; }
      if (n > 1e13) { err[c.n] = 'El número es demasiado grande.'; continue; }
      v = n;
    } else if (c.t === 'int') {
      const n = Number(v);
      if (!Number.isInteger(n)) { err[c.n] = 'Ingresá un número entero.'; continue; }
      if (c.min !== undefined && n < c.min) { err[c.n] = `El mínimo es ${c.min}.`; continue; }
      if (c.max !== undefined && n > c.max) { err[c.n] = `El máximo es ${c.max}.`; continue; }
      v = n;
    } else if (c.t === 'date') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v) || isNaN(parseISO(v)) || v < '2000-01-01' || v > '2100-12-31') { err[c.n] = 'Fecha inválida.'; continue; }
    } else if (c.t === 'text') {
      if (c.max && v.length > c.max) { err[c.n] = `Máximo ${c.max} caracteres.`; continue; }
      if (c.patron && !c.patron.test(v)) { err[c.n] = 'Usá solo letras, números, punto o guion, sin espacios.'; continue; }
      if (c.mayus) v = v.toUpperCase();
    } else if (c.t === 'select') {
      if (!c.o.some(([k]) => k === v)) { err[c.n] = 'Elegí una opción válida.'; continue; }
    }
    out[c.n] = v;
  }
  if (!Object.keys(err).length && formActual.def.validar) Object.assign(err, formActual.def.validar(out) || {});
  return { ok: !Object.keys(err).length, row: out, err };
}
function mostrarErrores(err) {
  $$('#form-fila .field').forEach(f => { const m = err[f.dataset.campo]; f.classList.toggle('invalid', !!m); f.querySelector('.err').textContent = m || ''; });
  const n = Object.keys(err).length;
  $('#form-fila .formerr').innerHTML = n ? `<div class="banner bad" role="alert"><span class="bi">!</span><div>Revisá ${n === 1 ? 'el campo marcado' : `los ${n} campos marcados`}.</div></div>` : '';
  if (n) $(`#f-${Object.keys(err)[0]}`)?.focus();
}
function enviarForm() {
  const { ok, row, err } = validarForm();
  mostrarErrores(err);
  if (!ok) return;
  const { hoja, def, extra } = formActual;
  const final = { ...(formActual.row || {}), ...(extra.fijos || {}), ...row };
  if (def.alGuardar) def.alGuardar(final);
  if (final._borrar) { // por ejemplo, vendiste toda la tenencia
    if (final.id) borrarFila(hoja, final.id);
    cerrarForm(); toast('Vendiste todo: la tenencia se borró.', 'ok', 3000); return;
  }
  guardarFila(hoja, final);
  cerrarForm();
  toast('Guardado ✓' + (S.cfg.scriptUrl ? '' : ' (en el dispositivo)'), 'ok', 2200);
}

/* =====================================================================
   24. EVENTOS
   ===================================================================== */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-tab]'); if (!t) return;
  const ds = t.dataset;
  if (ds.tab) return irA(ds.tab);
  if (ds.periodo) { S.ui.periodo = ds.periodo; return renderTodo(); }
  if (ds.mes) { S.ui[ds.mes] = addMonths(S.ui[ds.mes], +ds.d); return renderTodo(); }
  if (ds.vg) { S.ui.vistaGastos = ds.vg; return renderTodo(); }
  if (ds.fv) { S.ui.filtroVenc = ds.fv; return renderTodo(); }
  if (ds.nuevaInv) { abrirForm('Inversiones', null, { vals: { tipo: ds.nuevaInv, plataforma: ds.nuevaInv === 'liquidez' ? 'Galicia' : 'Cocos', monedaCompra: ds.nuevaInv === 'accion' ? 'USD' : 'ARS' }, titulo: { accion: 'acción o cripto', liquidez: 'dinero disponible', fci: 'FCI' }[ds.nuevaInv] }); return; }
  if (ds.edit) { const row = S.data[ds.edit].find(r => r.id === ds.id); if (row) abrirForm(ds.edit, row); return; }
  if ('pagar' in ds) { const v = buscarVenc(t); if (v) marcarVenc(v, 'pagado'); return; }
  if ('despagar' in ds) { const v = buscarVenc(t); if (v) marcarVenc(v, 'pendiente'); return; }
  if ('vencEdit' in ds) {
    const v = buscarVenc(t); if (!v) return;
    if (v.id) abrirForm('Vencimientos', S.data.Vencimientos.find(x => x.id === v.id));
    else toast('Este vencimiento se calcula solo. Marcalo como pagado o cambiá los días de cierre en Ajustes.', 'info');
    return;
  }
  if (ds.devolver) { const g = S.data.Gastos.find(x => x.id === ds.devolver); if (g) { guardarFila('Gastos', { ...g, devuelto: 'si', fechaDevolucion: hoy() }); toast('Marcado como devuelto ✓', 'ok', 2200); } return; }
  if (ds.balde) {
    const b = BALDES.find(x => x.key === ds.balde); const row = S.data.Objetivos.find(o => o.balde === ds.balde);
    abrirForm('Objetivos', row || null, { titulo: b.nombre, fijos: { balde: b.key }, vals: row ? {} : { nombre: b.nombre } });
    return;
  }
  switch (ds.action) {
    case 'cerrar-sheet': return cerrarForm();
    case 'borrar-fila':
      if (confirm('¿Seguro que querés borrar este registro? No se puede deshacer.')) { borrarFila(formActual.hoja, formActual.row.id); cerrarForm(); toast('Borrado', 'ok', 2000); }
      return;
    case 'devolver-todos': {
      const d = deudaNegocio();
      if (!confirm(`¿Marcar ${d.items.length} gastos (${fmtV(d.total)}) como devueltos?`)) return;
      d.items.forEach(g => guardarFila('Gastos', { ...g, devuelto: 'si', fechaDevolucion: hoy() }, { render: false }));
      renderTodo(); toast('Todo marcado como devuelto ✓', 'ok'); return;
    }
    case 'probar': {
      const url = $('#a-url').value.trim(); if (!url) return toast('Primero escribí la URL del script.', 'warn');
      const prev = { u: S.cfg.scriptUrl, t: S.cfg.token }; S.cfg.scriptUrl = url; S.cfg.token = $('#a-token').value;
      llamarScript({ action: 'ping' }).then(() => toast('Conexión correcta con el script ✓', 'ok')).catch(er => toast(er.message, 'bad')).finally(() => { S.cfg.scriptUrl = prev.u; S.cfg.token = prev.t; });
      return;
    }
    case 'sync-ya': return sincronizar();
    case 'umbrales-default': Object.entries(DEFAULT_CFG.umbrales).forEach(([k, v]) => { const el = $('#u-' + k); if (el) el.value = fmtInput(v); }); return toast('Valores recomendados cargados. Tocá Guardar para aplicarlos.', 'info');
    case 'exportar': {
      const blob = new Blob([JSON.stringify({ exportado: new Date().toISOString(), data: S.data }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `finanzas-${hoy()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); return;
    }
    case 'borrar-local':
      if (S.queue.length && !confirm(`Hay ${S.queue.length} cambios sin sincronizar que se van a perder. ¿Continuar?`)) return;
      if (!confirm('Se borran los datos y ajustes guardados en este dispositivo (la hoja de Google no se toca). ¿Continuar?')) return;
      Object.keys(localStorage).filter(k => k.startsWith('fin.')).forEach(k => localStorage.removeItem(k));
      location.reload(); return;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'form-fila') enviarForm();
  if (e.target.id === 'form-ajustes') guardarAjustes(e.target);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'hist-sym') { S.ui.histSym = t.value; dibujarHistorial(t.value); return; }
  if (t.dataset.asignarInv !== undefined && t.value) { const i = S.data.Inversiones.find(x => x.id === t.dataset.asignarInv); if (i) { guardarFila('Inversiones', { ...i, balde: t.value }); toast('Inversión asignada ✓', 'ok', 2000); } return; }
  if (t.dataset.asignar !== undefined && t.value) { const i = S.data.Ingresos.find(x => x.id === t.dataset.asignar); if (i) { guardarFila('Ingresos', { ...i, balde: t.value }); toast('Ingreso asignado ✓', 'ok', 2000); } return; }
  if (formActual && t.closest('#form-fila')) {
    const campo = t.name;
    if (formActual.def.alCambiar) formActual.def.alCambiar(valoresForm(), campo, (n, v) => { const el = $('#f-' + n); if (el) el.value = typeof v === 'number' ? fmtInput(v) : v; });
    actualizarVisibles();
    const f = t.closest('.field'); if (f) { f.classList.remove('invalid'); f.querySelector('.err').textContent = ''; }
  }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') cerrarForm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) cerrarForm(); });
$('#fab').addEventListener('click', () => { const h = FAB_HOJA[S.ui.tab]; if (h) abrirForm(h); });
$('#btn-vista').addEventListener('click', () => { S.cfg.vista = vistaUSD() ? 'ARS' : 'USD'; guardarCfg(); renderTodo(); });
$('#sel-dolar').addEventListener('change', e => { S.cfg.dolarTipo = e.target.value; guardarCfg(); renderTodo(); });
$('#btn-refresh').addEventListener('click', () => { actualizarCotizaciones({ manual: true }); sincronizar(); });
$('#btn-sync').addEventListener('click', () => { if (S.sync.estado === 'local') { toast('Configurá la URL del script en Ajustes para sincronizar.', 'info'); return irA('ajustes'); } sincronizar(); });
window.addEventListener('online', () => { toast('Volvió la conexión: sincronizando…', 'info', 2500); sincronizar({ silencioso: true }); actualizarCotizaciones(); });
window.addEventListener('offline', () => { setSync('offline'); toast('Sin conexión: los cambios se guardan en el dispositivo.', 'warn'); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const ult = S.quotes.meta.ultima ? Date.now() - new Date(S.quotes.meta.ultima).getTime() : Infinity;
  if (ult > 5 * 60e3) actualizarCotizaciones();
  sincronizar({ silencioso: true });
});
window.addEventListener('error', e => toast('Error inesperado: ' + (e.message || 'desconocido'), 'bad'));
window.addEventListener('unhandledrejection', e => toast('Error inesperado: ' + (e.reason?.message || e.reason || 'desconocido'), 'bad'));

/* =====================================================================
   25. INICIO
   ===================================================================== */
/* ---------- Importación de historial desde un enlace ----------
   Formato: index.html#importar=<JSON comprimido con gzip, en base64url>.
   El contenido va después del "#", así que nunca se envía al servidor que aloja la app.
   JSON: { Ingresos: {cols:[...], rows:[[...]]}, Gastos: {cols:[...], rows:[[...]]} } */
async function importarDesdeEnlace() {
  const m = location.hash.match(/^#importar=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  history.replaceState(null, '', location.pathname + location.search); // saca los datos de la barra de direcciones
  try {
    if (!('DecompressionStream' in window)) throw new Error('Este navegador no puede leer el enlace. Abrilo con Chrome actualizado.');
    const b64 = m[1].replace(/-/g, '+').replace(/_/g, '/');
    const bytes = Uint8Array.from(atob(b64 + '==='.slice((b64.length + 3) % 4)), c => c.charCodeAt(0));
    const txt = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const datos = JSON.parse(txt);
    const hojas = Object.keys(datos).filter(h => HOJAS.includes(h) && Array.isArray(datos[h].rows));
    // Ajustes que puede traer el enlace (solo estos campos)
    const cfgOk = ['presupuesto', 'topeTarjetas', 'mesesObjetivo'];
    const cfgNuevo = datos.cfg && typeof datos.cfg === 'object' ? Object.fromEntries(Object.entries(datos.cfg).filter(([k, v]) => cfgOk.includes(k) && isFinite(+v) && +v >= 0).map(([k, v]) => [k, +v])) : {};
    if (!hojas.length && !Object.keys(cfgNuevo).length) throw new Error('El enlace no tiene datos para importar.');
    const resumen = [...hojas.map(h => `${datos[h].rows.length} ${h.toLowerCase()}`), ...(Object.keys(cfgNuevo).length ? ['tus topes de gasto'] : [])].join(' y ');
    if (!confirm(`Se van a cargar ${resumen}. Si ya estaban cargados, se actualizan sin duplicarse. ¿Continuar?`)) return;
    const ahora = new Date().toISOString();
    for (const h of hojas) {
      const { cols, rows, soloCampos } = datos[h];
      for (const r of rows) {
        let row = normalizarFila(Object.fromEntries(cols.map((c, i) => [c, r[i] ?? ''])));
        if (!row.id) continue;
        // soloCampos: si la fila ya existe, solo se cambian esos campos (no pisa saldos que editaste)
        // Objetivos: hay una fila por balde; si ya existe con otro id, se actualiza esa
        const previa = Array.isArray(soloCampos) && S.data[h].find(x => x.id === row.id || (h === 'Objetivos' && row.balde && x.balde === row.balde));
        if (previa) row = { ...previa, ...Object.fromEntries(soloCampos.map(c => [c, row[c]])) };
        row.actualizado = ahora;
        upsertLocal(h, row);
        encolar({ op: 'upsert', hoja: h, row });
      }
    }
    if (Object.keys(cfgNuevo).length) { Object.assign(S.cfg, cfgNuevo); guardarCfg(); }
    guardarDatos();
    toast(`Listo: ${resumen}. ${S.cfg.scriptUrl ? 'Se está guardando en tu planilla; puede tardar unos minutos.' : 'Configurá la URL del script para guardarlo en tu planilla.'}`, 'ok', 9000);
  } catch (e) {
    toast('No se pudo importar el historial: ' + e.message, 'bad');
  }
}

async function iniciar() {
  irA('resumen');
  setSync(S.cfg.scriptUrl ? (navigator.onLine ? 'idle' : 'offline') : 'local');
  await importarDesdeEnlace();
  renderTodo();
  sincronizar({ silencioso: true });
  actualizarCotizaciones();
  setInterval(() => actualizarCotizaciones(), 5 * 60 * 1000); // cotizaciones cada 5 minutos
  setInterval(() => { if (S.queue.length && navigator.onLine) sincronizar({ silencioso: true }); }, 60 * 1000); // reintento de la cola
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker no registrado:', err));
  }
}
iniciar();
