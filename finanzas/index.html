<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="color-scheme" content="dark">
<meta name="description" content="Ahorro, ingresos, gastos, cuotas e inversiones en tiempo real, sincronizado con tu Google Sheet.">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* =====================================================================
   1. TOKENS DE DISEÑO (tema oscuro, mobile-first)
   ===================================================================== */
:root{
  --bg:#0b0f14; --bg2:#10161d; --card:#151b23; --card2:#1c2430; --line:#263140;
  --txt:#e8edf3; --txt2:#b4c0cf; --muted:#8593a5;
  --acc:#3987e5; --acc2:#2a6fc4;
  /* Semáforo (colores de estado reservados, siempre con ícono + palabra) */
  --ok:#0ca30c; --ok-bg:rgba(12,163,12,.16); --ok-txt:#5fd35f;
  --warn:#fab219; --warn-bg:rgba(250,178,25,.16); --warn-txt:#fcc85a;
  --bad:#d03b3b; --bad-bg:rgba(208,59,59,.18); --bad-txt:#ff8a8a;
  /* Series de gráficos (paleta categórica validada para fondo oscuro) */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --r:16px; --nav-h:66px; --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);overflow-x:hidden;max-width:100%}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* =====================================================================
   2. ENCABEZADO Y NAVEGACIÓN INFERIOR
   ===================================================================== */
header.top{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:5px;min-height:56px}
header.top h1{font-size:18px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{min-width:40px;height:40px;border-radius:12px;background:var(--card2);display:inline-flex;align-items:center;
  justify-content:center;padding:0 7px;font-size:14px;font-weight:700;border:1px solid var(--line)}
.hsel{height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--line);padding:0 4px;font-size:14px;max-width:68px}
.sync{width:34px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;
  border:1px solid var(--line);background:var(--card2);position:relative}
.sync .dot{width:12px;height:12px;border-radius:50%;background:var(--muted)}
.sync[data-s=ok] .dot{background:var(--ok)} .sync[data-s=sync] .dot{background:var(--acc);animation:pulse 1s infinite}
.sync[data-s=pending] .dot,.sync[data-s=offline] .dot{background:var(--warn)} .sync[data-s=error] .dot{background:var(--bad)}
.sync .n{position:absolute;top:-5px;right:-5px;background:var(--warn);color:#000;border-radius:9px;font-size:11px;font-weight:800;padding:0 5px;line-height:17px}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0e141b;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b)}
nav.bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);
  font-size:12px;font-weight:600;position:relative;min-width:0}
nav.bottom button svg{width:26px;height:26px}
nav.bottom button[aria-current=page]{color:var(--txt)}
nav.bottom button[aria-current=page]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav.bottom .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:9px;padding:0 5px;line-height:17px}

main{padding:12px 12px calc(var(--nav-h) + var(--safe-b) + 90px);max-width:900px;margin:0 auto}
section.view{display:none} section.view.on{display:block}

/* =====================================================================
   3. COMPONENTES: tarjetas, KPI, filas, píldoras de semáforo
   ===================================================================== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;min-width:0}
.card h2{font-size:17px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.muted{color:var(--muted)} .small{font-size:13px} .txt2{color:var(--txt2)}
.big{font-size:clamp(24px,8vw,32px);font-weight:800;letter-spacing:-.5px;line-height:1.15;overflow-wrap:anywhere}
.mid{font-size:clamp(16px,5.4vw,21px);font-weight:800;line-height:1.2;white-space:nowrap}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .l{font-size:13px;color:var(--muted)} .stat .v{font-size:clamp(16px,5vw,20px);font-weight:800;overflow-wrap:anywhere}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;border-radius:999px;padding:3px 9px 3px 4px;white-space:nowrap;line-height:1.3}
.pill i{font-style:normal;width:17px;height:17px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#000;font-weight:900}
.pill.ok{background:var(--ok-bg);color:var(--ok-txt)} .pill.ok i{background:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn-txt)} .pill.warn i{background:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad-txt)} .pill.bad i{background:var(--bad);color:#fff}
.pill.na{background:var(--card2);color:var(--muted)} .pill.na i{background:var(--line);color:var(--txt2)}

.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:8px}
.bar>span{display:block;height:100%;border-radius:6px;background:var(--acc);max-width:100%}
.bar.ok>span{background:var(--ok)} .bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)}

/* KPI: 2 columnas; en pantallas chicas 4 visibles y el resto deslizando */
.kpis{display:grid;grid-auto-flow:column;grid-auto-columns:100%;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;gap:12px;margin-bottom:6px;overscroll-behavior-x:contain}
.kpis::-webkit-scrollbar{display:none}
.kpage{scroll-snap-align:start;display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.kpi .kl{font-size:13px;color:var(--txt2);font-weight:600;line-height:1.25}
.kpi .kv{font-size:clamp(17px,5.3vw,24px);font-weight:800;line-height:1.15;letter-spacing:-.4px;overflow-wrap:anywhere}
.kpi .ks{font-size:12.5px;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.kpi .pill{align-self:flex-start;margin-top:auto}
.dots{display:flex;justify-content:center;gap:8px;margin:4px 0 12px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)} .dots span.on{background:var(--txt2)}
@media (min-width:640px){.kpis{grid-auto-flow:row;grid-template-columns:1fr 1fr;overflow:visible}.kpage{display:contents}.dots{display:none}}

/* Selector segmentado */
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;gap:2px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;min-width:0;height:42px;border-radius:10px;font-size:13.5px;letter-spacing:-.3px;font-weight:700;color:var(--txt2);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}

/* Listas de filas */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line);width:100%;text-align:left;min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .r{text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:52%}
.item .a{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.pos{color:var(--ok-txt)} .neg{color:var(--bad-txt)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--card2);color:var(--txt2);margin-right:4px}
.tag.ok{background:var(--ok-bg);color:var(--ok-txt)} .tag.warn{background:var(--warn-bg);color:var(--warn-txt)} .tag.bad{background:var(--bad-bg);color:var(--bad-txt)}
.empty{color:var(--muted);text-align:center;padding:18px 8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;padding:0 18px;
  font-weight:800;font-size:16px;background:var(--card2);border:1px solid var(--line)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad-txt)}
.btn.sm{min-height:40px;font-size:14px;padding:0 12px;border-radius:12px}
.btn.block{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 140px}

.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);z-index:25;width:62px;height:62px;border-radius:20px;
  background:var(--acc);color:#fff;font-size:34px;font-weight:400;box-shadow:0 8px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}

.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;font-weight:600;border:1px solid}
.banner.bad{background:var(--bad-bg);border-color:var(--bad);color:#ffd4d4}
.banner.warn{background:var(--warn-bg);border-color:var(--warn);color:#ffe9b8}
.banner.info{background:rgba(57,135,229,.14);border-color:var(--acc);color:#d6e7ff}
.banner.ok{background:var(--ok-bg);border-color:var(--ok);color:#dcf7dc}
.banner b{font-weight:800}
.banner .bi{font-size:20px;line-height:1}
.banner button{text-decoration:underline;font-weight:800}

.mstep{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mstep button{width:48px;height:44px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-size:20px;font-weight:800}
.mstep div{flex:1;text-align:center;font-weight:800;font-size:17px}

/* Cotizaciones */
.quotes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.q{background:var(--card2);border-radius:12px;padding:8px 10px;min-width:0}
.q .qn{font-size:12.5px;color:var(--muted);font-weight:700}
.q .qv{font-size:clamp(15px,4.6vw,18px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q .qt{font-size:11.5px;color:var(--muted)}
.stale{color:var(--warn-txt);font-weight:800}

/* Gráficos */
.chart{position:relative;height:240px;width:100%}
.chart.tall{height:280px}
.chart canvas{max-width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px;color:var(--txt2)}
.legend span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;flex-shrink:0}

table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t td.n,table.t th.n{text-align:right}

/* =====================================================================
   4. HOJA INFERIOR (formularios) Y AVISOS
   ===================================================================== */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg2);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;overflow-x:hidden;
  border-radius:22px 22px 0 0;border:1px solid var(--line);padding:16px 16px calc(20px + var(--safe-b))}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sheet-head h2{flex:1;font-size:20px}
.sheet-head button{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:20px}
.field{margin-bottom:12px;min-width:0}
.field label{display:block;font-size:14px;font-weight:700;color:var(--txt2);margin-bottom:5px}
.field input,.field select{width:100%;height:52px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 12px;font-size:17px;min-width:0}
.field input[type=date]{min-height:52px}
.field small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.field .err{color:var(--bad-txt);font-size:13.5px;font-weight:700;margin-top:4px}
.field.invalid input,.field.invalid select{border-color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid2>.field{min-width:0}
.formerr{margin-bottom:10px}

#toasts{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none;align-items:center}
.toast{pointer-events:auto;max-width:560px;width:100%;background:#26303d;border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)}

.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu-grid button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-height:110px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:16px}
.menu-grid svg{width:34px;height:34px;color:var(--acc)}
details.card>summary{cursor:pointer;font-weight:700;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" ▾";color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <h1 id="titulo">Resumen</h1>
  <button class="sync" id="btn-sync" data-s="idle" title="Estado de sincronización" aria-label="Sincronizar ahora"><span class="dot"></span></button>
  <button class="hbtn" id="btn-vista" title="Ver en pesos o en dólares" aria-label="Cambiar moneda de visualización">ARS</button>
  <select class="hsel" id="sel-dolar" aria-label="Dólar para convertir">
    <option value="oficial">Oficial</option><option value="blue">Blue</option><option value="mep">MEP</option><option value="ccl">CCL</option>
  </select>
  <button class="hbtn" id="btn-refresh" aria-label="Actualizar cotizaciones y datos"><svg id="ico-refresh" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
</header>

<main id="main">
  <section class="view" id="v-resumen"></section>
  <section class="view" id="v-ingresos"></section>
  <section class="view" id="v-gastos"></section>
  <section class="view" id="v-cuotas"></section>
  <section class="view" id="v-inversiones"></section>
  <section class="view" id="v-vencimientos"></section>
  <section class="view" id="v-objetivos"></section>
  <section class="view" id="v-ajustes"></section>
  <section class="view" id="v-mas"></section>
</main>

<button class="fab" id="fab" aria-label="Agregar" hidden>+</button>

<nav class="bottom" id="nav" aria-label="Secciones"></nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" data-action="cerrar-sheet" aria-label="Cerrar">✕</button></div>
    <div id="sheet-body"></div>
  </div>
</div>
<div id="toasts" aria-live="assertive"></div>

<!-- Chart.js con versión fija. Si no carga (sin conexión y sin caché) la app sigue funcionando sin gráficos. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" crossorigin="anonymous"></script>
<script>
'use strict';
/* =====================================================================
   5. UTILIDADES: DOM, formato argentino, fechas
   ===================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);

/** Número con punto de miles y coma decimal (formato argentino, siempre con separador de miles). */
function fmtNum(n, dec = 0) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  const abs = Math.abs(n).toFixed(dec);
  const [ent, frac] = abs.split('.');
  const neg = n < 0 && Number(abs) !== 0;
  return (neg ? '−' : '') + ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (frac ? ',' + frac : '');
}
/** Monto con símbolo según moneda. ARS sin decimales, USD con dos. */
function fmtMon(n, moneda = 'ARS', dec) {
  if (n === null || n === undefined || !isFinite(n)) return '—';
  const d = dec ?? (moneda === 'USD' ? 2 : 0);
  const s = fmtNum(Math.abs(n), d);
  return (n < 0 && Number(Math.abs(n).toFixed(d)) !== 0 ? '−' : '') + (moneda === 'USD' ? 'US$\u00a0' : '$\u00a0') + s;
}
const fmtPct = (n, dec = 1) => (isFinite(n) ? fmtNum(n, dec) + ' %' : '—');
/** Número para mostrar dentro de un campo editable (sin miles, coma decimal). */
const fmtInput = n => (n === '' || n === null || n === undefined || !isFinite(n) ? '' : String(+Number(n).toFixed(8)).replace('.', ','));
/** Interpreta "1.234,56", "1234,56", "1234.56" o "1.500" (miles) como número. */
function parseNum(str, tipo = 'money') {
  let s = String(str ?? '').trim().replace(/\s|\$|US/gi, '');
  if (!s) return null;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
  else if (tipo === 'money' && /^-?\d{1,3}\.\d{3}$/.test(s)) s = s.replace('.', '');
  if (!/^-?\d*\.?\d+$/.test(s)) return NaN;
  return Number(s);
}

const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoy = () => isoDate(new Date());
const mesActual = () => hoy().slice(0, 7);
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return isoDate(d); };
const addMonths = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = (((m - 1) % 12) + 12) % 12 + 1; return `${y}-${pad(m)}`; };
const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dateInMonth = (ym, day) => `${ym}-${pad(clamp(day, 1, daysInMonth(ym)))}`;
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000); // b - a
const monthsBetween = (a, b) => { const [ay, am] = a.split('-').map(Number), [by, bm] = b.split('-').map(Number); return (by - ay) * 12 + (bm - am); };

    const aportes = sum(S.data.Ingresos.filter(i => i.balde === b.key), i => toARS(i.monto, i.moneda));
    const activos = ten.filter(t => t.inv.balde === b.key).sort((x, y) => y.valorARS - x.valorARS);
    const valorActivos = sum(activos, t => t.valorARS);
    const saldo = toARS(+row.saldoInicial || 0, mon) + aportes + valorActivos;
    let meta = toARS(+row.meta || 0, mon), auto = false;
    if (b.key === 'emergencia' && !(meta > 0)) { meta = gprom * U().fondoOk; auto = true; }
    if (b.key === 'inversion') { // trading: la "meta" es un tope, no conviene pasarlo
      const pesoTotal = totalInv > 0 ? valorActivos / totalInv * 100 : NaN;
      const tope = totalInv * U().tradeOk / 100;
      const nivel = !activos.length && !saldo ? 'na' : !isFinite(pesoTotal) ? 'na' : pesoTotal <= U().tradeOk ? 'ok' : pesoTotal <= U().tradeAt ? 'warn' : 'bad';
      return { ...b, row, saldo, meta: tope, auto: true, tope: true, pct: tope > 0 ? saldo / tope * 100 : NaN, falta: 0, aporte: 0, mesesRest: 0, nivel, meses: NaN, aportes, activos, valorActivos, pesoTotal };
    }
    const vencida = row.fechaMeta && row.fechaMeta < hoy();
    const mesesRest = row.fechaMeta ? Math.max(1, monthsBetween(cur, row.fechaMeta.slice(0, 7))) : +S.cfg.mesesObjetivo || 12;
    const falta = Math.max(0, meta - saldo), aporte = falta / mesesRest;
    const pct = meta > 0 ? saldo / meta * 100 : NaN;
    let nivel;
    if (b.key === 'emergencia') nivel = gprom > 0 ? Sem.fondo(saldo / gprom) : 'na';
    else if (!(meta > 0)) nivel = 'na';
    else if (falta <= 0) nivel = 'ok';
    else if (vencida) nivel = 'bad';
    else nivel = aporte <= Math.max(aprom, 0) ? 'ok' : 'warn';
    return { ...b, row, saldo, meta, auto, pct, falta, aporte, mesesRest, nivel, meses: gprom > 0 ? saldo / gprom : NaN, aportes, activos, valorActivos };
  });
}

function normalizarFila(r) {
  const o = {};
  for (const k in r) o[k] = NUMERICOS.includes(k) ? (r[k] === '' || r[k] === null ? '' : Number(r[k])) : r[k] === null || r[k] === undefined ? '' : String(r[k]);
  return o;
}
function upsertLocal(hoja, row) { const a = S.data[hoja]; const i = a.findIndex(r => r.id === row.id); if (i >= 0) a[i] = row; else a.push(row); }
function borrarLocal(hoja, id) { S.data[hoja] = S.data[hoja].filter(r => r.id !== id); }
/** Encola una operación; si ya había otra pendiente para la misma fila, la reemplaza. */
function encolar(op) {
  const id = op.row ? op.row.id : op.id;
  S.queue = S.queue.filter(q => !(q.hoja === op.hoja && (q.row ? q.row.id : q.id) === id));
  S.queue.push(op);
}
function guardarFila(hoja, row, { render = true } = {}) {
  row.id = row.id || uid();
  row.actualizado = new Date().toISOString();
  upsertLocal(hoja, row);
  encolar({ op: 'upsert', hoja, row });
  guardarDatos();

}
function borrarFila(hoja, id) {
  borrarLocal(hoja, id);
  encolar({ op: 'delete', hoja, id });
  guardarDatos(); renderTodo(); programarSync();
}

async function llamarScript(params, cuerpo) {
  const url = (S.cfg.scriptUrl || '').trim();
  if (!url) throw new Error('Configurá la URL del script en Ajustes.');
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    let res;
    if (cuerpo) {
      // text/plain evita la verificación CORS previa (preflight) que Apps Script no soporta
      res = await fetch(url, { method: 'POST', body: JSON.stringify({ ...cuerpo, token: S.cfg.token }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, signal: ctrl.signal, redirect: 'follow' });
    } else {
      const q = new URLSearchParams({ ...params, token: S.cfg.token, _: Date.now() });
      res = await fetch(url + (url.includes('?') ? '&' : '?') + q, { signal: ctrl.signal, redirect: 'follow' });
    }
    if (!res.ok) throw new Error(`El script respondió con error ${res.status}.`);
    const txt = await res.text(); let j;
    try { j = JSON.parse(txt); } catch (e) { throw new Error('Respuesta inválida del script. Revisá que la implementación tenga acceso "Cualquier persona".'); }
    if (!j.ok) throw new Error(j.error || 'Error desconocido del script.');
    return j;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('El script tardó demasiado en responder.');
    if (e instanceof TypeError) throw new Error('No se pudo conectar con el script. Revisá la conexión y la URL.');
    throw e;
  } finally { clearTimeout(t); }
}

let sincronizando = false, syncTimer = null;
function programarSync(ms = 1200) { clearTimeout(syncTimer); syncTimer = setTimeout(() => sincronizar({ silencioso: true }), ms); }
function setSync(estado, error = '') { S.sync = { estado, error }; renderSync(); }
async function sincronizar({ silencioso = false } = {}) {
  if (sincronizando) return;
  if (!S.cfg.scriptUrl) { setSync('local'); return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  sincronizando = true; setSync('sync');
  try {
    // 1) Subir cambios pendientes en lotes
    while (S.queue.length) {
      const lote = S.queue.slice(0, 25); // lotes chicos para no pasar el tiempo máximo de Apps Script
      const r = await llamarScript(null, { ops: lote });
      S.queue = S.queue.filter(q => !lote.includes(q));
      guardarDatos();
      (r.resultados || []).filter(x => !x.ok).forEach(x => toast('La hoja rechazó un cambio: ' + x.error, 'bad'));
    }
    // 2) Bajar todo y volver a aplicar lo que se haya cargado mientras tanto
    const r = await llamarScript({ action: 'all' });
    for (const h of HOJAS) S.data[h] = (r.data?.[h] || []).map(normalizarFila);
    for (const op of S.queue) op.op === 'upsert' ? upsertLocal(op.hoja, op.row) : borrarLocal(op.hoja, op.id);
    if (r.cotizaciones) aplicarMercado(r.cotizaciones);
    S.quotes.meta.scriptVersion = r.version || 1;
    S.lastSync = new Date().toISOString(); LS.set('lastSync', S.lastSync); LS.set('quotes', S.quotes);
    guardarDatos();
    setSync(S.queue.length ? 'pending' : 'ok');
    renderTodo();
  } catch (e) {
    setSync('error', e.message);
    if (!silencioso) toast(e.message, 'bad');
  } finally {
    sincronizando = false;
    if (S.queue.length && navigator.onLine && S.sync.estado !== 'error') programarSync(1500);
  }
}

/** Guarda el precio del día (en US$) de cada activo que tenés, para armar gráficos de precio en el tiempo. */
function registrarPreciosDelDia() {
  const d = hoy(); let cambio = false;
  for (const inv of S.data.Inversiones) {

  }

  for (const [k, v] of Object.entries(ind)) {

/* ---------- Alertas de mercado (reglas simples con datos en vivo) ---------- */
/** Valor de hace n días (o el más cercano anterior) y máximo de los últimos n días de un indicador. */
function histStats(k, n) {
  const h = S.hist[k] || {}; const desde = addDays(hoy(), -n);
  const dias = Object.keys(h).filter(x => x >= desde && x < hoy()).sort();
  if (!dias.length) return { max: NaN, inicio: NaN, dias: 0 };
  return { max: Math.max(...dias.map(x => h[x])), inicio: h[dias[0]], dias: dias.length };
}
function alertasMercado() {
  const out = [], add = (nivel, ico, titulo, texto) => out.push({ nivel, ico, titulo, texto });
  const q = S.quotes;
  // Dólar: salto en una semana y brecha con el oficial
  const mep = q.dolar.mep?.venta, ofi = q.dolar.oficial?.venta;
  if (mep > 0) {
    const s7 = histStats('_MEP', 7);
    const sube = s7.inicio > 0 ? (mep / s7.inicio - 1) * 100 : NaN;
    if (sube >= 8) add('bad', '💵', `El dólar MEP subió ${fmtPct(sube, 1)} en una semana`, 'Cambio imprevisto. Tus ahorros en dólares te protegen: no vendas dólares ahora y frená compras grandes en pesos con tarjeta.');
    else if (sube >= 4) add('warn', '💵', `El dólar MEP subió ${fmtPct(sube, 1)} en una semana`, 'Atención: puede venir más inflación. Mantené los ahorros en dólares.');
    if (ofi > 0) { const brecha = (mep / ofi - 1) * 100; if (brecha >= 20) add(brecha >= 35 ? 'bad' : 'warn', '⚖️', `Brecha MEP–oficial: ${fmtPct(brecha, 0)}`, 'Señal de tensión cambiaria. No conviene pasar dólares a pesos salvo para gastos.'); }
  }
  // Riesgo país
  const rp = q.riesgoPais?.valor;
  if (rp > 0) {
    const s7 = histStats('_RIESGO', 7), salto = s7.inicio > 0 ? rp - s7.inicio : NaN;
    if (salto >= 100) add('bad', '🇦🇷', `Riesgo país +${fmtNum(salto, 0)} puntos en una semana (${fmtNum(rp, 0)})`, 'Cambio imprevisto en Argentina. No sumes bonos ni ONs argentinas ahora; priorizá fondos en dólares cortos y lo que tengas afuera.');
    else if (rp >= 800) add('bad', '🇦🇷', `Riesgo país alto: ${fmtNum(rp, 0)} puntos`, 'Mercado nervioso por Argentina. Mantené los dólares en instrumentos cortos.');
    else if (rp >= 650) add('warn', '🇦🇷', `Riesgo país: ${fmtNum(rp, 0)} puntos`, 'Incertidumbre preelectoral. Evitá bonos que venzan después de octubre de 2027.');
  }
  // Pánico en la bolsa de EE.UU.
  const vix = q.mercado.VIX?.precio, spy = q.mercado.SPY?.precio;
  if (vix >= 30) add('bad', '🌪️', `Pánico en los mercados (VIX ${fmtNum(vix, 0)})`, 'No vendas por miedo. Si tu fondo de emergencia está completo, es oportunidad para comprar de a poco el ETF de Vivienda (SCHD).');
  else if (vix >= 22) add('warn', '🌫️', `Mercados nerviosos (VIX ${fmtNum(vix, 0)})`, 'Puede haber caídas fuertes. No hace falta hacer nada; no vendas en pánico.');
  if (spy > 0) {
    const s30 = histStats('_SPY', 30), caida = s30.max > 0 ? (1 - spy / s30.max) * 100 : NaN;
    if (caida >= 10) add('ok', '💡', `Oportunidad: la bolsa de EE.UU. cayó ${fmtPct(caida, 0)} en el mes`, 'Si tu emergencia está completa, comprá SCHD en 2 o 3 partes, sin pasar del 10 % de Vivienda en acciones.');
  }
  // Bitcoin y oro: oportunidades con tope
  const tr = estadoBaldes().find(b => b.key === 'inversion');
  const btc = q.cripto.BTC?.usd;
  if (btc > 0) {
    const s30 = histStats('BTC', 30), caida = s30.max > 0 ? (1 - btc / s30.max) * 100 : NaN;
    if (caida >= 15) add('ok', '💡', `Oportunidad: Bitcoin cayó ${fmtPct(caida, 0)} desde el máximo del mes`, tr && tr.pesoTotal < U().tradeOk ? `Podés comprar un poco con plata de Trading, sin pasar el tope del ${U().tradeOk} %.` : 'Trading ya está en el tope: no compres más.');
  }
  const oro = q.cripto.PAXG?.usd;
  if (oro > 0) {
    const s30 = histStats('PAXG', 30), caida = s30.max > 0 ? (1 - oro / s30.max) * 100 : NaN;
    if (caida >= 8) add('ok', '💡', `Oportunidad: el oro bajó ${fmtPct(caida, 0)} en el mes`, 'El oro protege ante guerras y crisis. Si está debajo del 7 % de tu patrimonio, podés sumar un poco a Vivienda.');
  }
  // Tu plan: ventas que ya dan ganancia y tope de trading
  const listas = valuarTenencias().filter(t => t.inv.plan === 'vender' && enGanancia(t));
  if (listas.length) add('info', '💰', `${listas.length} inversión(es) para vender ya están en ganancia`, listas.slice(0, 4).map(t => esc(t.inv.activo)).join(', ') + (listas.length > 4 ? '…' : '') + '. Mirá el Plan de venta en Objetivos.');
  if (tr && tr.nivel === 'bad') add('bad', '⚡', `Trading pasó el tope: ${fmtPct(tr.pesoTotal, 1)} de lo invertido`, `Vendé lo que sobre del ${U().tradeOk} % y pasalo a Vivienda.`);
  return out;

/** Promedio mensual de ingresos y gastos personales de los últimos n meses completos. */
function promedios(n = 6, mov = movimientos()) {
  const cur = mesActual(); let ing = 0, gas = 0, tarj = 0, m = 0;
  for (let k = 1; k <= n; k++) {
    const ym = addMonths(cur, -k);
    const gi = sum(mov.ingresos.filter(i => i.fecha.startsWith(ym)), i => i.ars), gg = mov.gastos.filter(g => g.personal && g.fecha.startsWith(ym));
    if (!gi && !gg.length) continue;
    ing += gi; gas += sum(gg, g => g.ars); tarj += sum(gg.filter(esGastoTarjeta), g => g.ars); m++;
  }
  return m ? { ing: ing / m, gas: gas / m, tarj: tarj / m, ahorro: (ing - gas) / m, meses: m } : null;
}
/** Gasto con tarjeta: compras pagadas con Visa/Mastercard o el pago del resumen (categoría "Tarjeta de crédito"). */
const esGastoTarjeta = g => TARJETAS.includes(g.medio) || g.cat === 'Tarjeta de crédito';
function tarjetasDelMes(mov = movimientos()) {
  const cur = mesActual();
  return sum(mov.gastos.filter(g => g.personal && g.fecha.startsWith(cur) && esGastoTarjeta(g) && g.cat !== 'Cuotas'), g => g.ars);
}
function cardPlanMensual(mov = movimientos()) {

  const topeT = +S.cfg.topeTarjetas || 0, tj = tarjetasDelMes(mov), pctT = topeT > 0 ? tj / topeT * 100 : NaN;
  const nivT = !(topeT > 0) ? 'na' : pctT <= 80 ? 'ok' : pctT <= 100 ? 'warn' : 'bad';
  const vac = bs.find(b => b.key === 'vacaciones');

      ${fila('Ahorro promedio (6 meses)', `<span class="${signo(pr.ahorro)}">${fmtV(pr.ahorro)}</span>`, `Ingresás ${fmtV(pr.ing)} y gastás ${fmtV(pr.gas)} por mes · ${pr.ahorro >= ideal ? 'te alcanza para las metas' : `faltan ${fmtV(ideal - pr.ahorro)} por mes`}`)}
      ${fila('Gasto máximo del mes', fmtV(Math.max(0, pr.ing - ideal)), 'Ingreso promedio menos el ahorro ideal')}
      ${fila('Tarjetas este mes', topeT > 0 ? `${fmtV(tj)} <span class="small muted">de ${fmtV(topeT)}</span>` : fmtV(tj), topeT > 0 ? `${pill(nivT)} Promedio 6 meses: ${fmtV(pr.tarj)}` : 'Poné un tope en Ajustes')}

    </div>${topeT > 0 ? barra(pctT, nivT) : ''}</div>`;
}
/* ---------- "Te sobra este mes" (como la celda Sobra de la planilla: Tengo − Pendiente) ---------- */
const normTexto = t => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ').trim();
/** Pesos que tenés hoy para gastar: cuentas, efectivo y fondos en pesos (sin los dólares, que son ahorro). */
function pesosDisponibles() {
  const items = S.data.Inversiones.filter(i => ['liquidez', 'efectivo', 'fci'].includes(i.tipo) && i.monedaCompra !== 'USD' && String(i.activo).toUpperCase() !== 'USD' && +i.cantidad > 0);
  return { items, total: sum(items, i => +i.cantidad) };
}
/** Lo que falta pagar del mes: vencimientos pendientes hasta fin de mes y gastos fijos (o resúmenes de tarjeta)
 *  del mes pasado que todavía no cargaste este mes, estimados con el monto del mes pasado. */
function pendienteDelMes(mov = movimientos()) {
  const cur = mesActual(), fin = addDays(addMonths(cur, 1) + '-01', -1), prev = addMonths(cur, -1);
  const pagados = new Set(mov.gastos.filter(g => g.personal && g.fecha.startsWith(cur)).map(g => normTexto(g.desc)));
  const items = [];
  const venc = vencimientosTodos().filter(v => v.estado !== 'pagado' && v.fecha <= fin && +v.monto > 0);
  for (const v of venc) items.push({ concepto: v.concepto, ars: toARS(v.monto, v.moneda), fecha: v.fecha, origen: v.fecha < hoy() ? 'Vencido' : 'Vencimiento' });
  const hayResumenAuto = venc.some(v => v.origen === 'tarjeta');
  const yaEstan = new Set(items.map(i => normTexto(i.concepto)));
  const vistos = new Set();
  for (const g of mov.gastos.filter(g => g.personal && g.fecha.startsWith(prev) && g.cat !== 'Cuotas' && (g.fijo || g.cat === 'Tarjeta de crédito'))) {
    const k = normTexto(g.desc);
    if (!k || pagados.has(k) || yaEstan.has(k)) continue;
    if (g.cat === 'Tarjeta de crédito' && hayResumenAuto) continue;
    if (vistos.has(k)) { items.find(i => i.k === k).ars += g.ars; continue; }
    vistos.add(k);
    items.push({ k, concepto: g.desc, ars: g.ars, fecha: cur + g.fecha.slice(7), origen: 'Fijo (estimado)' });
  }
  items.sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
  return { items, total: sum(items, i => i.ars) };
}
function cardSobra(mov = movimientos()) {
  const t = pesosDisponibles(), pe = pendienteDelMes(mov), sobra = t.total - pe.total;
  if (!t.items.length && !pe.items.length) return '';
  const nivel = sobra >= 0 ? 'ok' : 'bad';
  const fila = (a, b, s = '') => `<div class="item"><div class="main"><div class="t">${esc(a)}</div>${s ? `<div class="s">${s}</div>` : ''}</div><div class="r"><div class="a num">${b}</div></div></div>`;
  return `<div class="card"><h2>💵 ${sobra >= 0 ? 'Te sobra este mes' : 'Te falta este mes'}<span class="sp"></span>${pill(nivel)}</h2>
    <div class="big num ${sobra >= 0 ? 'pos' : 'neg'}">${fmtMon(sobra, 'ARS')}</div>
    <div class="small muted">${dolar() ? `≈ ${fmtMon(sobra / dolar(), 'USD')} · ` : ''}Tenés ${fmtMon(t.total, 'ARS')} en pesos − falta pagar ${fmtMon(pe.total, 'ARS')}</div>

}
/** Dinero disponible: cuentas y efectivo cargados en Inversiones como "Dinero disponible". */
function dineroDisponible() {
  const items = S.data.Inversiones.filter(i => i.tipo === 'liquidez' || i.tipo === 'efectivo');
  const ars = sum(items, i => (i.tipo === 'efectivo' && String(i.activo).toUpperCase() === 'USD') || i.monedaCompra === 'USD' ? toARS(i.cantidad, 'USD') : +i.cantidad || 0);

/** Total de resúmenes de tarjeta pendientes con vencimiento en los próximos 30 días contra lo disponible. */

    ${cardPlanMensual(mov)}

    ${(() => { const dd = dineroDisponible(); return `<div class="card"><h2>Dinero disponible<span class="sp"></span><button class="btn sm" data-tab="inversiones">Ver y editar</button></h2>

    ${chartCard('c-plataformas', 'Patrimonio por plataforma', peor(...inv.plataformas.map(p => Sem.concentracion(p.peso)), inv.plataformas.length ? 'ok' : 'na'))}
    ${chartCard('c-activos', 'Patrimonio por activo', Sem.btc(inv.tot.btcPct), '', `<div class="hint">Bitcoin: ${fmtPct(inv.tot.btcPct)} del patrimonio (banda ${U().btcMin}–${U().btcMax} %)</div>`)}
    ${chartCard('c-cuotas', 'Cuotas que vencen por mes', null)}
    <p class="small muted" style="text-align:center">Período: ${r.label}. Última sincronización: ${S.lastSync ? fmtHora(S.lastSync) : 'nunca'}.</p>`;
  // Indicador de página del carrusel de KPI
  const kp = $('#kpis');
  kp.addEventListener('scroll', () => { const i = Math.round(kp.scrollLeft / kp.clientWidth); $$('.dots span', el).forEach((s, j) => s.classList.toggle('on', j === i)); }, { passive: true });
  dibujarGraficos({ mov, r, presu, inv });
}
function chartCard(id, titulo, nivel, clase = '', extra = '') {
  return `<div class="card"><h2>${titulo}<span class="sp"></span>${nivel ? pill(nivel) : ''}</h2><div class="chart ${clase}"><canvas id="${id}" role="img" aria-label="${esc(titulo)}"></canvas></div>${extra}<div class="hint">Tocá el gráfico para ver el valor exacto.</div></div>`;
}

/* ---------- Gráficos (Chart.js) ---------- */
const charts = {};
const PALETA = ['#3987e5', '#d95926', '#199e70', '#c98500', '#d55181', '#008300', '#9085e9', '#e66767'];
function chartBase(tipo, data, opts = {}) {
  return {
    type: tipo, data,
    options: Object.assign({
      responsive: true, maintainAspectRatio: false, animation: { duration: 250 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#b4c0cf', boxWidth: 12, boxHeight: 12, font: { size: 12 } } },
        tooltip: { backgroundColor: '#26303d', borderColor: '#3a4656', borderWidth: 1, titleColor: '#fff', bodyColor: '#e8edf3', padding: 10,
          callbacks: { label: c => ` ${c.dataset.label}: ${fmtMon(c.parsed.y ?? c.parsed, monedaV())}` } },
      },
      scales: {
        x: { ticks: { color: '#8593a5', maxRotation: 0, autoSkip: true, font: { size: 11 } }, grid: { display: false } },
        y: { ticks: { color: '#8593a5', font: { size: 11 }, callback: v => abreviar(v) }, grid: { color: 'rgba(255,255,255,.06)' }, beginAtZero: true },
      },
    }, opts),
  };
}
/** Etiquetas cortas del eje: 1,2 M / 350 k. */
function abreviar(v) { const a = Math.abs(v); return a >= 1e6 ? fmtNum(v / 1e6, 1) + ' M' : a >= 1e3 ? fmtNum(v / 1e3, 0) + ' k' : fmtNum(v, 0); }
function crearChart(id, cfg) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
  const cv = document.getElementById(id); if (!cv) return;
  if (!window.Chart) { cv.parentElement.innerHTML = '<div class="empty">Los gráficos no están disponibles sin conexión la primera vez. Abrí la app con internet una vez.</div>'; return; }
  charts[id] = new Chart(cv, cfg);
}
const sinDatos = id => { if (charts[id]) { charts[id].destroy(); delete charts[id]; } const cv = document.getElementById(id); if (cv) cv.parentElement.innerHTML = '<div class="empty">Todavía no hay datos para este gráfico.</div>'; };
const lvlTxt = nv => `${NIVEL[nv].ico} ${NIVEL[nv].txt}`;

function dibujarGraficos({ mov, r, presu, inv }) {
  const V = x => enVista(x);
  const gP = mov.gastos.filter(g => g.personal);
  // 1) Gasto diario (o mensual en el año) + acumulado vs. presupuesto
  {
    const dias = diffDays(r.desde, r.hasta) + 1;
    const porMes = dias > 100;
    const labels = [], diario = [], acum = [], pres = [], niveles = [];
    let a = 0;
    if (porMes) {
      for (let k = 0; k < 12; k++) { const ym = r.desde.slice(0, 4) + '-' + pad(k + 1); labels.push(fmtMesCorto(ym)); const v = sum(gP.filter(g => g.fecha.startsWith(ym)), g => g.ars); a += v; diario.push(V(v)); acum.push(V(a)); pres.push(presu ? V(presu / 12 * (k + 1)) : null); }
    } else {
      for (let k = 0; k < dias; k++) { const f = addDays(r.desde, k); labels.push(fmtDM(f)); const v = sum(gP.filter(g => g.fecha === f), g => g.ars); a += v; diario.push(V(v)); acum.push(V(a)); pres.push(presu ? V(presu / dias * (k + 1)) : null); }
    }
    acum.forEach((v, i) => niveles.push(pres[i] ? Sem.gasto(v / pres[i] * 100) : 'na'));
    if (!a && !presu) sinDatos('c-diario');
    else crearChart('c-diario', chartBase('bar', {
      labels, datasets: [
        { type: 'bar', label: porMes ? 'Gasto del mes' : 'Gasto del día', data: diario, backgroundColor: PALETA[1], borderRadius: 4, order: 2 },
        { type: 'line', label: 'Acumulado', data: acum, borderColor: '#e8edf3', borderWidth: 2, pointRadius: 0, pointHitRadius: 10, tension: .2, order: 1,
          segment: { borderColor: c => COLOR_NIVEL[niveles[c.p1DataIndex]] || '#e8edf3' } },
        { type: 'line', label: 'Presupuesto', data: pres, borderColor: '#8593a5', borderDash: [6, 5], borderWidth: 2, pointRadius: 0, pointHitRadius: 10, order: 0 },
      ],
    }, { plugins: { ...chartBase().options.plugins, tooltip: { ...chartBase().options.plugins.tooltip, callbacks: { ...chartBase().options.plugins.tooltip.callbacks, footer: it => (niveles[it[0].dataIndex] !== 'na' ? 'Estado: ' + lvlTxt(niveles[it[0].dataIndex]) : '') } } } }));
  }
  // 2) Ingresos vs. gastos por semana (semanas del período, mínimo 4)
  {
    const fin = r.hasta > hoy() ? hoy() : r.hasta;
    const semanas = Math.max(4, Math.ceil((diffDays(r.desde, fin) + 1) / 7));
    const labels = [], ingr = [], gast = [], niv = [];
    for (let k = semanas - 1; k >= 0; k--) {
      const h = addDays(fin, -7 * k), d = addDays(h, -6), rr = { desde: d, hasta: h };
      const vi = sum(mov.ingresos.filter(i => enRango(i, rr)), i => i.ars), vg = sum(gP.filter(g => enRango(g, rr)), g => g.ars);
      labels.push(fmtDM(d)); ingr.push(V(vi)); gast.push(V(vg)); niv.push(Sem.ahorro(vi > 0 ? (vi - vg) / vi * 100 : NaN, vi, vg));
    }
    if (!sum(ingr) && !sum(gast)) sinDatos('c-semanal');
    else crearChart('c-semanal', chartBase('bar', { labels, datasets: [
      { label: 'Ingresos', data: ingr, backgroundColor: PALETA[0], borderRadius: 4 },
      { label: 'Gastos', data: gast, backgroundColor: PALETA[1], borderRadius: 4 }] },
    { plugins: { ...chartBase().options.plugins, tooltip: { ...chartBase().options.plugins.tooltip, callbacks: { ...chartBase().options.plugins.tooltip.callbacks, title: it => 'Semana desde ' + it[0].label, footer: it => 'Ahorro: ' + lvlTxt(niv[it[0].dataIndex]) } } } }));
  }
  // 3) Últimos 12 meses con línea de ahorro (puntos con color de semáforo)
  {
    const labels = [], ingr = [], gast = [], aho = [], niv = [];
    for (let k = 11; k >= 0; k--) {
      const ym = addMonths(mesActual(), -k);
      const vi = sum(mov.ingresos.filter(i => i.fecha.startsWith(ym)), i => i.ars), vg = sum(gP.filter(g => g.fecha.startsWith(ym)), g => g.ars);
      labels.push(fmtMesCorto(ym)); ingr.push(V(vi)); gast.push(V(vg)); aho.push(V(vi - vg)); niv.push(Sem.ahorro(vi > 0 ? (vi - vg) / vi * 100 : NaN, vi, vg));
    }
    if (!sum(ingr) && !sum(gast)) sinDatos('c-12m');
    else crearChart('c-12m', chartBase('bar', { labels, datasets: [
      { type: 'bar', label: 'Ingresos', data: ingr, backgroundColor: PALETA[0], borderRadius: 4, order: 2 },
      { type: 'bar', label: 'Gastos', data: gast, backgroundColor: PALETA[1], borderRadius: 4, order: 2 },
      { type: 'line', label: 'Ahorro', data: aho, borderColor: PALETA[2], borderWidth: 2, tension: .25, order: 1, pointRadius: 5, pointHitRadius: 12,
        pointBackgroundColor: niv.map(n => COLOR_NIVEL[n]), pointBorderColor: '#151b23', pointBorderWidth: 2 }] },
    { plugins: { ...chartBase().options.plugins, tooltip: { ...chartBase().options.plugins.tooltip, callbacks: { ...chartBase().options.plugins.tooltip.callbacks, footer: it => 'Ahorro: ' + lvlTxt(niv[it[0].dataIndex]) } } } }));
  }
  // 4) Evolución del patrimonio (hoja Historial)
  {
    let hs = S.data.Historial.filter(h => h.fecha >= r.desde && h.fecha <= r.hasta);
    if (hs.length < 2) hs = S.data.Historial;
    hs = [...hs].sort((a, b) => (a.fecha < b.fecha ? -1 : 1));
    if (!hs.length) sinDatos('c-patrimonio');
    else {
      const vals = hs.map(h => (vistaUSD() ? +h.patrimonioUSD : +h.patrimonioARS));
      crearChart('c-patrimonio', chartBase('line', { labels: hs.map(h => fmtDM(h.fecha)), datasets: [{ label: 'Patrimonio', data: vals, borderColor: PALETA[0], backgroundColor: 'rgba(57,135,229,.15)', fill: true, borderWidth: 2, tension: .25, pointRadius: hs.length > 40 ? 0 : 3, pointHitRadius: 12,
        segment: { borderColor: c => (c.p1.parsed.y >= c.p0.parsed.y ? PALETA[0] : COLOR_NIVEL.bad) } }] },
      { plugins: { legend: { display: false }, tooltip: { ...chartBase().options.plugins.tooltip, callbacks: { label: c => ' ' + fmtMon(c.parsed.y, monedaV()), footer: it => { const i = it[0].dataIndex; if (!i) return ''; const d = (vals[i] - vals[i - 1]) / vals[i - 1] * 100; return `${mas(d)}${fmtPct(d)} vs. registro anterior · ${lvlTxt(d >= 0 ? 'ok' : d > -5 ? 'warn' : 'bad')}`; } } } }, scales: { ...chartBase().options.scales, y: { ...chartBase().options.scales.y, beginAtZero: false } } }));
    }
  }
  // 5) Dona de gastos por categoría, con detalle al tocar
  {
    const gs = gP.filter(g => enRango(g, r));
    const cats = agruparSimple(gs, g => g.cat);
    if (!cats.length) sinDatos('c-categorias');
    else {
      const top = plegarOtros(cats, 8);
      crearChart('c-categorias', dona(top.map(c => c.k), top.map(c => V(c.v)), (ev, els) => {
        if (!els.length) return;
        const cat = top[els[0].index];
        const items = cat.k === 'Otros' ? gs.filter(g => !top.slice(0, -1).some(t => t.k === g.cat)) : gs.filter(g => g.cat === cat.k);
        $('#cat-detalle').innerHTML = `<div class="card" style="background:var(--card2);margin:10px 0 0"><h2>${esc(cat.k)}<span class="sp"></span><span class="num">${fmtV(cat.v)}</span></h2><div class="list">${items.sort((a, b) => b.ars - a.ars).slice(0, 12).map(g => `<div class="item"><div class="main"><div class="t">${esc(g.desc || g.cat)}</div><div class="s">${fmtFecha(g.fecha)} · ${esc(MEDIOS[g.medio] || '')}</div></div><div class="r"><div class="a num">${fmtV(g.ars)}</div></div></div>`).join('')}</div></div>`;
      }));
    }
  }
  // 6) Barras apiladas: ingreso fijo vs. variable por mes
  {
    const desde = r.desde.slice(0, 7) < addMonths(mesActual(), -5) ? r.desde.slice(0, 7) : addMonths(mesActual(), -5);
    const hasta = mesActual();
    const labels = [], fijo = [], vari = [];
    for (let ym = desde; ym <= hasta; ym = addMonths(ym, 1)) {
      labels.push(fmtMesCorto(ym));
      fijo.push(V(sum(mov.ingresos.filter(i => i.fijo && i.fecha.startsWith(ym)), i => i.ars)));
      vari.push(V(sum(mov.ingresos.filter(i => !i.fijo && i.fecha.startsWith(ym)), i => i.ars)));
    }
    if (!sum(fijo) && !sum(vari)) sinDatos('c-fijovar');
    else crearChart('c-fijovar', chartBase('bar', { labels, datasets: [
      { label: 'Fijo', data: fijo, backgroundColor: PALETA[0], borderRadius: 4, borderColor: '#151b23', borderWidth: { top: 2 } },
      { label: 'Variable', data: vari, backgroundColor: PALETA[2], borderRadius: 4, borderColor: '#151b23', borderWidth: { top: 2 } }] },
    { scales: { x: { ...chartBase().options.scales.x, stacked: true }, y: { ...chartBase().options.scales.y, stacked: true } },
      plugins: { ...chartBase().options.plugins, tooltip: { ...chartBase().options.plugins.tooltip, callbacks: { ...chartBase().options.plugins.tooltip.callbacks, footer: it => 'Total: ' + fmtMon(sum(it, x => x.parsed.y), monedaV()) } } } }));
  }
  // 7) Donas de patrimonio por plataforma y por activo
  {
    const pl = plegarOtros(inv.plataformas.map(p => ({ k: p.k, v: p.valorARS, peso: p.peso })), 8);
    if (!pl.length || !inv.tot.valorARS) sinDatos('c-plataformas');
    else crearChart('c-plataformas', dona(pl.map(p => `${p.k} · ${lvlTxt(Sem.concentracion(p.v / inv.tot.valorARS * 100))}`), pl.map(p => V(p.v)), null, inv.tot.valorARS));
    const ac = plegarOtros(inv.activos.map(a => ({ k: a.k, v: a.valorARS })), 8);
    if (!ac.length || !inv.tot.valorARS) sinDatos('c-activos');
    else crearChart('c-activos', dona(ac.map(a => a.k === 'BTC' ? `BTC · ${lvlTxt(Sem.btc(inv.tot.btcPct))}` : a.k), ac.map(a => V(a.v)), null, inv.tot.valorARS));
  }
  // 8) Cuotas que vencen por mes (próximos 12), coloreadas según el peso sobre el ingreso fijo
  {
    const ind = cuotasIndividuales();
    const ingFijoRef = sum(mov.ingresos.filter(i => i.fijo && i.fecha.startsWith(addMonths(mesActual(), -1))), i => i.ars) || sum(mov.ingresos.filter(i => i.fijo && i.fecha.startsWith(mesActual())), i => i.ars);
    const labels = [], vals = [], niv = [];
    for (let k = 0; k < 12; k++) {
      const ym = addMonths(mesActual(), k);
      const v = sum(ind.filter(i => i.fecha.startsWith(ym)), i => i.ars);
      labels.push(fmtMesCorto(ym)); vals.push(V(v)); niv.push(v > 0 ? (ingFijoRef > 0 ? Sem.cuotas(v / ingFijoRef * 100) : 'na') : 'ok');
    }
    if (!sum(vals)) sinDatos('c-cuotas');
    else crearChart('c-cuotas', chartBase('bar', { labels, datasets: [{ label: 'Cuotas', data: vals, backgroundColor: niv.map(n => COLOR_NIVEL[n]), borderRadius: 4 }] },
      { plugins: { legend: { display: false }, tooltip: { ...chartBase().options.plugins.tooltip, callbacks: { label: c => ' Cuotas: ' + fmtMon(c.parsed.y, monedaV()), footer: it => 'Estado: ' + lvlTxt(niv[it[0].dataIndex]) + (ingFijoRef > 0 ? ` (${fmtPct(it[0].parsed.y / enVista(ingFijoRef) * 100, 0)} del ingreso fijo)` : '') } } } }));
  }
}
function agruparSimple(items, clave) {
  const m = new Map(); for (const x of items) m.set(clave(x), (m.get(clave(x)) || 0) + x.ars);
  return [...m.entries()].map(([k, v]) => ({ k, v })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
}
/** Deja como máximo n-1 grupos y suma el resto en "Otros" (nunca se generan colores extra). */
function plegarOtros(arr, n) {
  if (arr.length <= n) return arr;
  const top = arr.slice(0, n - 1); const resto = arr.slice(n - 1);
  return [...top, { k: 'Otros', v: sum(resto, x => x.v) }];
}
function dona(labels, data, onClick, totalARS) {
  const total = sum(data);
  return {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: labels.map((_, i) => PALETA[i % PALETA.length]), borderColor: '#151b23', borderWidth: 2, hoverOffset: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '58%', onClick: onClick || undefined,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#b4c0cf', boxWidth: 12, font: { size: 12 } } },
        tooltip: { backgroundColor: '#26303d', padding: 10, callbacks: { label: c => ` ${fmtMon(c.parsed, monedaV())} (${fmtPct(total ? c.parsed / total * 100 : 0)})` } },
      },
    },
  };
}

/* =====================================================================
   17. PESTAÑA GASTOS (con deuda del negocio)
   ===================================================================== */
function renderGastos() {
  const el = $('#v-gastos'); const vista = S.ui.vistaGastos;
  const seg = `<div class="seg" role="group"><button data-vg="todos" aria-pressed="${vista === 'todos'}">Todos</button><button data-vg="negocio" aria-pressed="${vista === 'negocio'}">Negocio me debe</button></div>`;

    el.innerHTML = `${seg}
      <div class="card"><h2>El negocio me debe<span class="sp"></span>${pill(d.nivel)}</h2><div class="big num">${fmtV(d.total)}</div>
        <div class="small muted">${d.items.length} gasto(s) del negocio pagados con tarjeta personal${d.items.length ? ` · el más antiguo tiene ${d.diasMax} días` : ''}</div>
        ${d.items.length > 1 ? `<div class="btns" style="margin-top:12px"><button class="btn okb" data-action="devolver-todos">✓ Marcar todos como devueltos</button></div>` : ''}</div>
      <div class="card"><div class="list">${d.items.map(g => { const dias = diffDays(g.fecha, hoy()); const nv = dias > U().deudaDias ? 'bad' : 'warn'; return `<div class="item"><div class="main"><div class="t">${esc(g.descripcion)}</div><div class="s">${fmtFecha(g.fecha)} · ${MEDIOS[g.medio]} · hace ${dias} días</div></div><div class="r"><div class="a num">${fmtMon(+g.monto, g.moneda)}</div>${pill(nv)}<button class="btn sm okb" data-devolver="${esc(g.id)}">Devuelto</button></div></div>`; }).join('') || empty('No hay nada pendiente de devolución. 🎉')}</div></div>`;
    return;
  }
  const ym = S.ui.mesGas;
  const items = S.data.Gastos.filter(g => (g.fecha || '').startsWith(ym)).sort((a, b) => (a.fecha < b.fecha ? 1 : -1));
  const pers = items.filter(g => g.ambito !== 'negocio');

/** Gráfico de precio de un activo: cripto con 30 días de CoinGecko; el resto con el historial que va guardando la app. */
const cacheHist = {};
async function dibujarHistorial(sym) {
  const inv = S.data.Inversiones.find(i => String(i.activo).toUpperCase() === sym);
  let puntos = Object.entries(S.hist[sym] || {}).sort().map(([d, v]) => ({ d, v }));
  let fuente = 'historial guardado por la app';
  const id = CRIPTO_IDS[sym] || CRIPTO_EXTRA[sym] || (inv?.tipo === 'cripto' ? sym.toLowerCase() : null);
  if (id) {
    try {
      if (!cacheHist[sym] || Date.now() - cacheHist[sym].at > 30 * 60e3) {
        const j = await fetchJSON(`https://api.coingecko.com/api/v3/coins/${encodeURIComponent(id)}/market_chart?vs_currency=usd&days=30&interval=daily`);
        cacheHist[sym] = { at: Date.now(), puntos: (j.prices || []).map(([t, v]) => ({ d: isoDate(new Date(t)), v })) };
      }
      puntos = cacheHist[sym].puntos; fuente = 'CoinGecko, últimos 30 días';
    } catch (e) { fuente = 'historial guardado por la app (CoinGecko no respondió)'; }
  } else {
    puntos = puntos.filter(p => p.d >= addDays(hoy(), -30));
  }
  if (S.ui.tab !== 'inversiones' || S.ui.histSym !== sym || !document.getElementById('c-hist')) return; // cambió la pantalla mientras cargaba
  const nota = $('#hist-nota');
  if (puntos.length < 2) {
    if (charts['c-hist']) { charts['c-hist'].destroy(); delete charts['c-hist']; }
    nota.textContent = 'Todavía no hay historial de este activo: la app guarda el precio de cada día, así que el gráfico se va armando solo.';
    $('#hist-pill').innerHTML = ''; return;
  }
  const vals = puntos.map(p => (vistaUSD() || !dolar() ? p.v : p.v * dolar()));
  const pct = (vals[vals.length - 1] - vals[0]) / vals[0] * 100;
  $('#hist-pill').innerHTML = `<span class="small num ${signo(pct)}" style="margin-right:6px">${mas(pct)}${fmtPct(pct)}</span>${pill(Sem.inversion(pct))}`;
  const mon = vistaUSD() || !dolar() ? 'USD' : 'ARS';
  crearChart('c-hist', chartBase('line', { labels: puntos.map(p => fmtDM(p.d)), datasets: [{ label: sym, data: vals, borderColor: pct >= 0 ? PALETA[0] : COLOR_NIVEL.bad, backgroundColor: 'rgba(57,135,229,.12)', fill: true, borderWidth: 2, tension: .2, pointRadius: 0, pointHitRadius: 10 }] },
    { plugins: { legend: { display: false }, tooltip: { ...chartBase().options.plugins.tooltip, callbacks: { label: c => ' ' + fmtMon(c.parsed.y, mon, c.parsed.y < 10 ? 4 : 2) } } }, scales: { ...chartBase().options.scales, y: { ...chartBase().options.scales.y, beginAtZero: false, ticks: { ...chartBase().options.scales.y.ticks, callback: v => fmtNum(v, v < 10 ? 2 : 0) } } } }));
  nota.textContent = `Precio en ${mon === 'USD' ? 'dólares' : 'pesos'} · fuente: ${fuente}. Tocá el gráfico para ver el valor exacto.`;
}

/* Plan de venta: cada tenencia puede estar marcada para vender ('vender') o para esperar ('esperar').
 * Las marcadas para vender se separan según su resultado de hoy: en ganancia → vender ya. */
const enGanancia = t => (t.inv.monedaCompra === 'ARS' ? t.plARS : t.plUSD) >= 0;
const pctPlan = t => (t.inv.monedaCompra === 'ARS' ? t.plPctARS : t.plPctUSD);
function tagPlan(t) {
  if (t.inv.plan === 'vender') return enGanancia(t) ? `<span class="tag ok">💰 Vender ya</span>` : `<span class="tag warn">Vender al recuperar</span>`;
  if (t.inv.plan === 'esperar') return `<span class="tag">⏳ Esperar</span>`;
  return '';
}
function cardPlanVenta() {

function guardarAjustes(form) {
  let ok = true; const errores = [];
  const setErr = (id, msg) => { const f = $('#' + id).closest('.field'); f.classList.toggle('invalid', !!msg); f.querySelector('.err').textContent = msg || ''; if (msg) { ok = false; errores.push(id); } };
  const leer = (id, min, max, entero) => { const v = parseNum($('#' + id).value, 'money'); if (v === null || isNaN(v)) { setErr(id, 'Ingresá un número.'); return null; } if (v < min || v > max) { setErr(id, `Tiene que estar entre ${min} y ${max}.`); return null; } if (entero && !Number.isInteger(v)) { setErr(id, 'Tiene que ser un número entero.'); return null; } setErr(id, ''); return v; };
  const url = $('#a-url').value.trim();
  if (url && !/^https:\/\/\S+$/.test(url)) setErr('a-url', 'La URL tiene que empezar con https://');
  else if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { setErr('a-url', ''); toast('Ojo: la URL no parece de Google Apps Script.', 'warn'); }
  else setErr('a-url', '');
  const nuevo = mezclar(S.cfg, {});
  nuevo.presupuesto = leer('a-presu', 0, 1e12); nuevo.topeTarjetas = leer('a-topet', 0, 1e12); nuevo.disponibleTarjetas = leer('a-disp', 0, 1e12); nuevo.mesesObjetivo = leer('a-meses', 1, 600, true);
  for (const m of TARJETAS) nuevo.tarjetas[m] = { cierre: leer(`a-${m}-cierre`, 1, 31, true), venc: leer(`a-${m}-venc`, 1, 31, true) };
  for (const [, campos] of UMBRALES_UI) for (const [k] of campos) nuevo.umbrales[k] = leer('u-' + k, 0, 1000);
  const u = nuevo.umbrales;
  if (ok) {
    const pares = [['ahorroAt', 'ahorroOk', 'El amarillo del ahorro tiene que ser menor que el verde.'], ['gastoOk', 'gastoAt', 'El verde del gasto tiene que ser menor que el amarillo.'], ['cobAt', 'cobOk', 'El amarillo de cobertura tiene que ser menor que el verde.'], ['concOk', 'concAt', 'El verde de concentración tiene que ser menor que el amarillo.'], ['fondoUrg', 'fondoOk', 'El rojo del fondo tiene que ser menor que el verde.'], ['btcMin', 'btcMax', 'La banda mínima de bitcoin tiene que ser menor que la máxima.'], ['cuotasOk', 'cuotasAt', 'El verde de cuotas tiene que ser menor que el amarillo.']];
    for (const [a, b, msg] of pares) if (!(u[a] < u[b])) setErr('u-' + a, msg);
  }
  if (!ok) { toast('Revisá los campos marcados en rojo.', 'bad'); $('#' + errores[0])?.focus(); return; }
  const cambioUrl = url !== S.cfg.scriptUrl || $('#a-token').value !== S.cfg.token;
  nuevo.scriptUrl = url; nuevo.token = $('#a-token').value; nuevo.vista = $('#a-vista').value; nuevo.dolarTipo = $('#a-dolar').value;
  S.cfg = nuevo; guardarCfg();
  toast('Ajustes guardados ✓', 'ok', 2500);
  renderTodo();
  if (cambioUrl && url) { sincronizar(); actualizarCotizaciones(); }
}
